# DW Alliance application routing (included by every server block in the dwalliance site).
# Rendered by cli/dw-render-nginx; __PHP_SOCK__ is replaced with the PHP-FPM pool socket.
root /var/www/html;
index index.php;
client_max_body_size 12m;
# Keep nginx's own redirects (e.g. GET /store -> /store/) relative so https and the host are kept.
absolute_redirect off;
# Claimed sites: "/" serves the site's index.html (map $dw_root_index in the site file).
if ($dw_root_index) {
    rewrite ^/$ /index.html last;
}

# Published API specs and the JS client name the platform hosts; serve them through the brand
# filter so they name this install (lib/dw_theme_static.php, lib/DwBrand.php).
location = /openapi/files.json { rewrite ^ /lib/dw_theme_static.php last; }
location = /openapi/affiliate.json { rewrite ^ /lib/dw_theme_static.php last; }
location = /js/dw/dw.js { rewrite ^ /lib/dw_theme_static.php last; }

location / {
    # Host-keyed HTML cache: serve a hit from disk with no PHP.
    # Path is /var/lib/app/data/html-cache/$host$uri (index.html for a trailing slash).
    # Only .html/.htm and watermarkable .jpg/.jpeg/.png/.webp/.pdf are served this way. .dwmeta / .tmp / dotfiles are not.
    # if + try_files in the same location is ignored by nginx, so a miss jumps to a named location (error_page 418 = $dest).
    set $html_cache_rel $uri;
    if ($uri ~ /$ ) {
        set $html_cache_rel "${uri}index.html";
    }
    set $html_cache_dest @app;
    if (-f /var/lib/app/data/html-cache/$host$html_cache_rel) {
        set $html_cache_dest /internal-html-cache/$host$html_cache_rel;
    }
    if ($html_cache_rel !~* \.(html|htm|jpg|jpeg|png|webp|pdf)$) {
        set $html_cache_dest @app;
    }
    # Affiliate ref/aff: bypass the cache so PHP can record the referral and Set-Cookie.
    # Module paths (the reserved folders) record the ref themselves and must not be sent to 404.php.
    set $aff_bypass "";
    if ($arg_ref != "") { set $aff_bypass 1; }
    if ($arg_aff != "") { set $aff_bypass 1; }
    if ($http_x_dw_ref != "") { set $aff_bypass 1; }
    if ($uri ~ ^/(account_setup|address|affiliate|affiliates|crm|customer_session|dns|domain|end_user_account_setup|files|link_tree|markup|note_files|notes|permissions|relation|session|store|internal-files|_dw|lib)(/|$)) { set $aff_bypass ""; }
    if ($aff_bypass = 1) { set $html_cache_dest @affiliate_ref; }
    error_page 418 = $html_cache_dest;
    return 418;
}
location @affiliate_ref {
    rewrite ^ /404.php last;
}
location @app {
    # Watermarkable types are never served from the on-disk original under WEB_ROOT/<brand>/.
    # Always miss to 404.php, which writes the host-keyed cache (watermarked or a plain copy) outside the docroot.
    if ($uri ~* \.(jpg|jpeg|png|webp|pdf)$) {
        rewrite ^ /404.php last;
    }
    try_files $uri $uri/ /404.php;
}
# /affiliates/* -> /affiliate/* (308 preserves POST). Query string is kept.
location ~ ^/affiliates(/.*)?$ {
    return 308 /affiliate$1$is_args$args;
}
# /session/login and /session/logout are HTML pages routed by 404.php, not module folders.
location ~ ^/session/(login|logout)/?$ {
    try_files $uri $uri/ /404.php;
}
# A POST (or any non-GET/HEAD) to a module path without the trailing slash is served directly
# (nginx's automatic 301 would drop the request body). GET/HEAD keep the redirect to the help page.
location ~ ^/(account_setup|address|affiliate|affiliates|crm|customer_session|dns|domain|end_user_account_setup|files|link_tree|markup|note_files|notes|permissions|relation|session|store)(/[a-z_]+)*$ {
    if ($request_method !~ ^(GET|HEAD)$) {
        rewrite ^/([a-z_/]+)$ /$1/index.php last;
    }
    try_files $uri $uri/ /404.php;
}
location ^~ /internal-html-cache/ {
    internal;
    alias /var/lib/app/data/html-cache/;
    types {
        text/html html htm;
        image/jpeg jpg jpeg;
        image/png png;
        image/webp webp;
        application/pdf pdf;
    }
    default_type application/octet-stream;
    etag on;
    if ($request_uri ~* \.(dwmeta|tmp)$) { return 404; }
    if ($request_uri ~ /\.) { return 404; }
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Vary "Sec-Fetch-Dest" always;
    add_header X-DW-Html-Cache hit always;
}
location ^~ /internal-files/ {
    internal;
    alias /var/www/html/;
}
location ~ \.php$ {
    include fastcgi_params;
    fastcgi_pass unix:__PHP_SOCK__;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_read_timeout 120s;
}
location ~ /\. { deny all; }
